version: '3.8'

services:
  agentqa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentqa
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3:1.7b
      - AGENTQA_PORT=3001
      - DEMO_MODE=true
      - DEMO_APP_URL=http://demo-app:3000
      - NODE_ENV=production
      - AGENTQA_STORAGE_DIR=/data/runs
    volumes:
      - agentqa_runs:/data/runs
    depends_on:
      ollama:
        condition: service_healthy
      demo-app:
        condition: service_healthy
    restart: unless-stopped
    shm_size: 2gb
    networks:
      - agentqa-net

  demo-app:
    build:
      context: ./apps/demo-app
      dockerfile: Dockerfile
    container_name: agentqa-demo-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped
    networks:
      - agentqa-net

  ollama:
    image: ollama/ollama:latest
    container_name: agentqa-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped
    networks:
      - agentqa-net

  ollama-init:
    image: curlimages/curl:latest
    container_name: agentqa-ollama-init
    environment:
      - MODEL=qwen3:1.7b
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Checking if model $MODEL is already available..."
        if curl -sf "$OLLAMA_URL/api/tags" | grep -q "$MODEL"; then
          echo "Model $MODEL already exists, skipping pull."
        else
          echo "Pulling model $MODEL from Ollama..."
          curl -X POST "$OLLAMA_URL/api/pull" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$MODEL\"}" \
            --no-buffer -s | while IFS= read -r line; do
              echo "$line"
            done
          echo "Model pull complete."
        fi
    restart: "no"
    networks:
      - agentqa-net

volumes:
  agentqa_runs:
  ollama_models:

networks:
  agentqa-net:
    name: agentqa-network
